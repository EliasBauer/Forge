rule_files:
  - ../recording-rules.yml
  - ../alerts.yml.tmpl

evaluation_interval: 1m

tests:
  - name: maintenance_active_and_overrun
    interval: 1m
    input_series:
      - series: "forge_maintenance_mode"
        values: "1x20"
      - series: "forge_maintenance_suppress_until_timestamp_seconds"
        values: "900x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: ForgeMaintenanceActive
        exp_alerts:
          - exp_labels:
              severity: "info"
              service: "maintenance"
              notification_scope: "none"
              alert_family: "maintenance"
            exp_annotations:
              summary: "Forge maintenance suppression is active"
              impact: "Maintenance-sensitive alerts are inhibited until the suppression window ends."
              first_action: "Confirm the maintenance window and its expected completion time."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-continuity"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgemaintenanceactive"
      - eval_time: 5m
        alertname: ForgeMaintenanceOverrun
        exp_alerts: []
      - eval_time: 16m
        alertname: ForgeMaintenanceActive
        exp_alerts: []
      - eval_time: 16m
        alertname: ForgeMaintenanceOverrun
        exp_alerts:
          - exp_labels:
              severity: "critical"
              service: "maintenance"
              notification_scope: "always"
              alert_family: "maintenance"
            exp_annotations:
              summary: "Forge maintenance exceeded its suppression window"
              impact: "Maintenance remains active while operational alerts are no longer inhibited."
              first_action: "Contact the maintenance owner and decide whether to finish or extend the window."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-continuity"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgemaintenanceoverrun"
  - name: backup_telemetry_missing
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 31m
        alertname: ForgeBackupTelemetryMissing
        exp_alerts:
          - exp_labels:
              severity: "warning"
              service: "backup"
              notification_scope: "business_hours"
              alert_family: "backup"
            exp_annotations:
              summary: "Backup success telemetry is missing"
              impact: "Operators cannot verify the age of the latest successful backup."
              first_action: "Check the backup metrics producer and Pushgateway series."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-continuity"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgebackuptelemetrymissing"
  - name: graphql_warning_only
    interval: 1m
    input_series:
      - series: "graphql_errors_total{operation_name=\"unknown\",code=\"INTERNAL_SERVER_ERROR\"}"
        values: "0+0.4x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeGraphqlServerFaultsWarning
        exp_alerts:
          - exp_labels:
              severity: "warning"
              service: "api"
              notification_scope: "business_hours"
              alert_family: "graphql-server-faults"
              maintenance_sensitive: "true"
            exp_annotations:
              summary: "GraphQL server faults exceed the warning floor"
              impact: "Some GraphQL-backed user workflows are failing."
              first_action: "Inspect recent GraphQL operations and correlated web exceptions."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-api"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgegraphqlserverfaultswarning"
      - eval_time: 10m
        alertname: ForgeGraphqlServerFaultsCritical
        exp_alerts: []
  - name: graphql_critical
    interval: 1m
    input_series:
      - series: "graphql_errors_total{operation_name=\"unknown\",code=\"INTERNAL_SERVER_ERROR\"}"
        values: "0+10x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeGraphqlServerFaultsWarning
        exp_alerts:
          - exp_labels:
              severity: "warning"
              service: "api"
              notification_scope: "business_hours"
              alert_family: "graphql-server-faults"
              maintenance_sensitive: "true"
            exp_annotations:
              summary: "GraphQL server faults exceed the warning floor"
              impact: "Some GraphQL-backed user workflows are failing."
              first_action: "Inspect recent GraphQL operations and correlated web exceptions."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-api"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgegraphqlserverfaultswarning"
      - eval_time: 10m
        alertname: ForgeGraphqlServerFaultsCritical
        exp_alerts:
          - exp_labels:
              severity: "critical"
              service: "api"
              notification_scope: "business_hours"
              alert_family: "graphql-server-faults"
              maintenance_sensitive: "true"
            exp_annotations:
              summary: "GraphQL server faults exceed the critical floor"
              impact: "GraphQL-backed workflows are failing at a sustained high volume."
              first_action: "Identify the dominant failing operation and inspect its web exceptions."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-api"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgegraphqlserverfaultscritical"
  - name: tls_warning
    interval: 1m
    input_series:
      - series: "probe_ssl_earliest_cert_expiry{job=\"blackbox\",probe=\"public_https\"}"
        values: "2505600x20"
    alert_rule_test:
      - eval_time: 16m
        alertname: ForgeTlsExpiryWarning
        exp_alerts:
          - exp_labels:
              job: "blackbox"
              probe: "public_https"
              severity: "warning"
              service: "public-api"
              notification_scope: "business_hours"
              alert_family: "tls-expiry"
            exp_annotations:
              summary: "Forge TLS certificate expires within 30 days"
              impact: "The public endpoint will become unavailable if the certificate is not renewed."
              first_action: "Verify the certificate expiry date and renewal automation."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-api"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgetlsexpirywarning"
      - eval_time: 16m
        alertname: ForgeTlsExpiryCritical
        exp_alerts: []
  - name: tls_critical
    interval: 1m
    input_series:
      - series: "probe_ssl_earliest_cert_expiry{job=\"blackbox\",probe=\"public_https\"}"
        values: "518400x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: ForgeTlsExpiryWarning
        exp_alerts: []
      - eval_time: 6m
        alertname: ForgeTlsExpiryCritical
        exp_alerts:
          - exp_labels:
              job: "blackbox"
              probe: "public_https"
              severity: "critical"
              service: "public-api"
              notification_scope: "always"
              alert_family: "tls-expiry"
            exp_annotations:
              summary: "Forge TLS certificate expires within 7 days"
              impact: "Public HTTPS access is at imminent risk."
              first_action: "Start emergency certificate renewal and verify the served certificate."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-api"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgetlsexpirycritical"
  - name: meilisearch_health_failed
    interval: 1m
    input_series:
      - series: "probe_success{job=\"blackbox\",probe=\"meilisearch_health\"}"
        values: "0x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: ForgeMeilisearchUnavailable
        exp_alerts:
          - exp_labels:
              job: "blackbox"
              probe: "meilisearch_health"
              severity: "critical"
              service: "meilisearch"
              notification_scope: "business_hours"
              alert_family: "meilisearch-availability"
              maintenance_sensitive: "true"
            exp_annotations:
              summary: "Meilisearch remains unavailable"
              impact: "Search-backed user workflows are unavailable."
              first_action: "Inspect Meilisearch health, resources, and startup logs."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-search"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgemeilisearchunavailable"
  - name: meilisearch_health_absent
    interval: 1m
    alert_rule_test:
      - eval_time: 6m
        alertname: ForgeMeilisearchUnavailable
        exp_alerts:
          - exp_labels:
              job: "blackbox"
              probe: "meilisearch_health"
              severity: "critical"
              service: "meilisearch"
              notification_scope: "business_hours"
              alert_family: "meilisearch-availability"
              maintenance_sensitive: "true"
            exp_annotations:
              summary: "Meilisearch remains unavailable"
              impact: "Search-backed user workflows are unavailable."
              first_action: "Inspect Meilisearch health, resources, and startup logs."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-search"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgemeilisearchunavailable"
  - name: disk_warning
    interval: 1m
    input_series:
      - series: "node_filesystem_avail_bytes{fstype=\"ext4\",mountpoint=\"/data\"}"
        values: "10x20"
      - series: "node_filesystem_size_bytes{fstype=\"ext4\",mountpoint=\"/data\"}"
        values: "100x20"
    alert_rule_test:
      - eval_time: 16m
        alertname: ForgeFilesystemLow
        exp_alerts:
          - exp_labels:
              fstype: "ext4"
              mountpoint: "/data"
              severity: "warning"
              service: "host"
              notification_scope: "business_hours"
              alert_family: "host-filesystem"
            exp_annotations:
              summary: "Host filesystem has less than 15 percent free"
              impact: "Persistent services may soon be unable to write data."
              first_action: "Identify the affected mount and its largest safe-to-review consumers."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-host-containers"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgefilesystemlow"
      - eval_time: 16m
        alertname: ForgeFilesystemCritical
        exp_alerts: []
  - name: disk_critical
    interval: 1m
    input_series:
      - series: "node_filesystem_avail_bytes{fstype=\"ext4\",mountpoint=\"/data\"}"
        values: "4x20"
      - series: "node_filesystem_size_bytes{fstype=\"ext4\",mountpoint=\"/data\"}"
        values: "100x20"
    alert_rule_test:
      - eval_time: 16m
        alertname: ForgeFilesystemLow
        exp_alerts:
          - exp_labels:
              fstype: "ext4"
              mountpoint: "/data"
              severity: "warning"
              service: "host"
              notification_scope: "business_hours"
              alert_family: "host-filesystem"
            exp_annotations:
              summary: "Host filesystem has less than 15 percent free"
              impact: "Persistent services may soon be unable to write data."
              first_action: "Identify the affected mount and its largest safe-to-review consumers."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-host-containers"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgefilesystemlow"
      - eval_time: 16m
        alertname: ForgeFilesystemCritical
        exp_alerts:
          - exp_labels:
              fstype: "ext4"
              mountpoint: "/data"
              severity: "critical"
              service: "host"
              notification_scope: "always"
              alert_family: "host-filesystem"
            exp_annotations:
              summary: "Host filesystem has less than 5 percent free"
              impact: "Persistent services face imminent write failures."
              first_action: "Identify the affected mount and safely reclaim or add capacity."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-host-containers"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgefilesystemcritical"
  - name: maintenance_recovery
    interval: 1m
    input_series:
      - series: "forge_maintenance_mode"
        values: "1x5 0x15"
      - series: "forge_maintenance_suppress_until_timestamp_seconds"
        values: "900x5 660x15"
    alert_rule_test:
      - eval_time: 12m
        alertname: ForgeMaintenanceActive
        exp_alerts: []
      - eval_time: 12m
        alertname: ForgeMaintenanceOverrun
        exp_alerts: []
  - name: fresh_backup
    interval: 1m
    input_series:
      - series: "backup_last_success_timestamp_seconds"
        values: "60x40"
    alert_rule_test:
      - eval_time: 31m
        alertname: ForgeBackupTelemetryMissing
        exp_alerts: []
      - eval_time: 31m
        alertname: ForgeBackupStale
        exp_alerts: []
  - name: api_latency_same_api
    interval: 1m
    input_series:
      - series: 'forge:api_request_duration_seconds:p95_5m{api="graphql"}'
        values: "4x30"
      - series: 'forge_api_requests_total{api="graphql",status="200"}'
        values: "0+3x30"
    alert_rule_test:
      - eval_time: 21m
        alertname: ForgeApiLatencyCritical
        exp_alerts:
          - exp_labels:
              api: "graphql"
              severity: "critical"
              service: "api"
              notification_scope: "business_hours"
              alert_family: "api-latency"
              maintenance_sensitive: "true"
            exp_annotations:
              summary: "Forge API p95 latency exceeds three seconds"
              impact: "Active API workflows are severely degraded."
              first_action: "Inspect slow endpoints, web saturation, and dependency latency."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-api"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgeapilatencycritical"
  - name: api_latency_cross_api
    interval: 1m
    input_series:
      - series: 'forge:api_request_duration_seconds:p95_5m{api="graphql"}'
        values: "4x30"
      - series: 'forge_api_requests_total{api="auth",status="200"}'
        values: "0+3x30"
    alert_rule_test:
      - eval_time: 21m
        alertname: ForgeApiLatencyCritical
        exp_alerts: []
  - name: telemetry_blackbox_down
    interval: 1m
    input_series:
      - series: 'up{job="blackbox"}'
        values: "0x10"
      - series: 'up{job="forge-web"}'
        values: "1x10"
      - series: 'probe_success{job="blackbox",probe="public_https"}'
        values: "1x10"
      - series: 'probe_success{job="blackbox",probe="public_graphql"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: ForgePublicProbeDown
        exp_alerts: []
      - eval_time: 6m
        alertname: ForgeTelemetryTargetDown
        exp_alerts:
          - exp_labels:
              job: "blackbox"
              severity: "critical"
              service: "observability"
              notification_scope: "always"
              alert_family: "telemetry-target"
            exp_annotations:
              summary: "A core telemetry target is down"
              impact: "Operational visibility is incomplete for the affected target."
              first_action: "Identify the failed scrape job and inspect target health and connectivity."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-continuity"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgetelemetrytargetdown"
  - name: public_probe_web_absent
    interval: 1m
    input_series:
      - series: 'up{job="blackbox"}'
        values: "1x10"
      - series: 'probe_success{job="blackbox",probe="public_https"}'
        values: "1x10"
      - series: 'probe_success{job="blackbox",probe="public_graphql"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: ForgePublicProbeDown
        exp_alerts:
          - exp_labels:
              job: "forge-web"
              severity: "critical"
              service: "public-api"
              notification_scope: "always"
              alert_family: "public-probe"
              maintenance_sensitive: "true"
            exp_annotations:
              summary: "Public Forge probe is failing"
              impact: "Users may be unable to reach public Forge workflows."
              first_action: "Open the API dashboard, then check Nginx and web logs for the failing probe."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-api"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgepublicprobedown"
      - eval_time: 6m
        alertname: ForgeTelemetryTargetDown
        exp_alerts: []
  - name: public_probe_down
    interval: 1m
    input_series:
      - series: 'up{job="blackbox"}'
        values: "1x10"
      - series: 'up{job="forge-web"}'
        values: "1x10"
      - series: 'probe_success{job="blackbox",probe="public_https"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: ForgePublicProbeDown
        exp_alerts:
          - exp_labels:
              job: "blackbox"
              probe: "public_https"
              severity: "critical"
              service: "public-api"
              notification_scope: "always"
              alert_family: "public-probe"
              maintenance_sensitive: "true"
            exp_annotations:
              summary: "Public Forge probe is failing"
              impact: "Users may be unable to reach public Forge workflows."
              first_action: "Open the API dashboard, then check Nginx and web logs for the failing probe."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-api"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgepublicprobedown"
      - eval_time: 6m
        alertname: ForgeTelemetryTargetDown
        exp_alerts: []
  - name: public_probe_absent
    interval: 1m
    input_series:
      - series: 'up{job="blackbox"}'
        values: "1x10"
      - series: 'up{job="forge-web"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: ForgePublicProbeDown
        exp_alerts:
          - exp_labels:
              job: "blackbox"
              severity: "critical"
              service: "public-api"
              notification_scope: "always"
              alert_family: "public-probe"
              maintenance_sensitive: "true"
            exp_annotations:
              summary: "Public Forge probe is failing"
              impact: "Users may be unable to reach public Forge workflows."
              first_action: "Open the API dashboard, then check Nginx and web logs for the failing probe."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-api"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgepublicprobedown"
      - eval_time: 6m
        alertname: ForgeTelemetryTargetDown
        exp_alerts: []
  - name: telemetry_blackbox_absent
    interval: 1m
    input_series:
      - series: 'up{job="forge-web"}'
        values: "1x10"
      - series: 'probe_success{job="blackbox",probe="public_https"}'
        values: "1x10"
      - series: 'probe_success{job="blackbox",probe="public_graphql"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: ForgePublicProbeDown
        exp_alerts: []
      - eval_time: 6m
        alertname: ForgeTelemetryTargetDown
        exp_alerts:
          - exp_labels:
              job: "blackbox"
              severity: "critical"
              service: "observability"
              notification_scope: "always"
              alert_family: "telemetry-target"
            exp_annotations:
              summary: "A core telemetry target is down"
              impact: "Operational visibility is incomplete for the affected target."
              first_action: "Identify the failed scrape job and inspect target health and connectivity."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-continuity"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgetelemetrytargetdown"
  - name: backup_first_transfer_failure
    interval: 1m
    input_series:
      - series: 'backup_transfer_last_failure_timestamp_seconds{job="forge_backup"}'
        values: "60x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: ForgeBackupTransferFailed
        exp_alerts:
          - exp_labels:
              job: "forge_backup"
              severity: "critical"
              service: "backup"
              notification_scope: "always"
              alert_family: "backup-transfer"
            exp_annotations:
              summary: "Latest backup transfer failed"
              impact: "The newest backup may not exist in off-host storage."
              first_action: "Inspect transfer logs, destination availability, and the local backup artifact."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-continuity"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgebackuptransferfailed"
  - name: backup_never_succeeded
    interval: 1m
    input_series:
      - series: "prometheus_tsdb_lowest_timestamp_seconds"
        values: "0x3100"
      - series: 'process_start_time_seconds{job="prometheus"}'
        values: "0x2940 176400x160"
    alert_rule_test:
      - eval_time: 49h
        alertname: ForgeBackupCritical
        exp_alerts: []
      - eval_time: 50h15m
        alertname: ForgeBackupCritical
        exp_alerts: []
      - eval_time: 50h16m
        alertname: ForgeBackupCritical
        exp_alerts:
          - exp_labels:
              severity: "critical"
              service: "backup"
              notification_scope: "always"
              alert_family: "backup"
            exp_annotations:
              summary: "Latest successful backup is more than 50 hours old"
              impact: "Recoverable data may be more than two days old."
              first_action: "Start incident response for the failed backup chain and preserve evidence."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-continuity"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgebackupcritical"
      - eval_time: 51h
        alertname: ForgeBackupCritical
        exp_alerts:
          - exp_labels:
              severity: "critical"
              service: "backup"
              notification_scope: "always"
              alert_family: "backup"
            exp_annotations:
              summary: "Latest successful backup is more than 50 hours old"
              impact: "Recoverable data may be more than two days old."
              first_action: "Start incident response for the failed backup chain and preserve evidence."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-continuity"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgebackupcritical"
  - name: restore_never_verified
    interval: 1m
    input_series:
      - series: "prometheus_tsdb_lowest_timestamp_seconds"
        values: "0x23100"
      - series: 'process_start_time_seconds{job="prometheus"}'
        values: "0x20160 1209600x2940"
    alert_rule_test:
      - eval_time: 14d
        alertname: ForgeRestoreVerificationCritical
        exp_alerts: []
      - eval_time: 15d15m
        alertname: ForgeRestoreVerificationCritical
        exp_alerts: []
      - eval_time: 15d16m
        alertname: ForgeRestoreVerificationCritical
        exp_alerts:
          - exp_labels:
              severity: "critical"
              service: "restore"
              notification_scope: "business_hours"
              alert_family: "restore-verification"
            exp_annotations:
              summary: "Restore verification is more than 15 days old"
              impact: "Backup restorability has been unverified for over two weeks."
              first_action: "Prioritize a controlled restore verification and investigate repeated failures."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-continuity"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgerestoreverificationcritical"
      - eval_time: 16d
        alertname: ForgeRestoreVerificationCritical
        exp_alerts:
          - exp_labels:
              severity: "critical"
              service: "restore"
              notification_scope: "business_hours"
              alert_family: "restore-verification"
            exp_annotations:
              summary: "Restore verification is more than 15 days old"
              impact: "Backup restorability has been unverified for over two weeks."
              first_action: "Prioritize a controlled restore verification and investigate repeated failures."
              dashboard_url: "https://__MONITORING_DOMAIN__/d/forge-continuity"
              runbook_url: "__RUNBOOK_BASE_URL__/alerts.md#forgerestoreverificationcritical"
